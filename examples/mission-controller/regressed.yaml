name: autonomous_mission_controller
title: Autonomous Mission Controller (Regressed)
description: >
  Identical to the safe baseline, but the guard on the `authorized_actuation`
  transition has been weakened: the requirement that a human operator
  authorize the action has been removed. The platform can now actuate while
  communications are lost and no human has authorized the command.

variables:
  mode:
    type: enum
    values: [Idle, Armed, Mission, DegradedComms, Recovery, EmergencyLand, Actuate]
    initial: Idle
  comms:
    type: enum
    values: [OK, Lost]
    initial: OK
  gps:
    type: enum
    values: [OK, Lost]
    initial: OK
  battery:
    type: enum
    values: [High, Low]
    initial: High
  human_authorized:
    type: bool
    initial: false
  sensor_agreement:
    type: bool
    initial: true
  armed_before:
    type: bool
    initial: false

transitions:
  - name: low_battery_recovery
    reactive: true
    guard: "(mode == Mission or mode == DegradedComms) and battery == Low"
    updates:
      mode: Recovery

  - name: comms_degrade
    reactive: true
    guard: "mode == Mission and comms == Lost"
    updates:
      mode: DegradedComms

  - name: arm
    guard: "mode == Idle and human_authorized == true"
    updates:
      mode: Armed
      armed_before: true

  - name: start_mission
    guard: "mode == Armed and gps == OK and battery == High"
    updates:
      mode: Mission

  - name: emergency_land
    guard: "mode == Recovery"
    updates:
      mode: EmergencyLand

  # REGRESSED: the `human_authorized == true` clause has been removed.
  - name: authorized_actuation
    guard: "mode == DegradedComms and comms == Lost and sensor_agreement == true"
    updates:
      mode: Actuate

  - name: operator_authorize
    guard: "human_authorized == false and (mode == Idle or mode == Armed)"
    updates:
      human_authorized: true

  - name: operator_revoke
    guard: "human_authorized == true and (mode == Idle or mode == Armed)"
    updates:
      human_authorized: false

  - name: comms_loss
    guard: "comms == OK"
    updates:
      comms: Lost

  - name: comms_restore
    guard: "comms == Lost"
    updates:
      comms: OK

  - name: gps_loss
    guard: "gps == OK and (mode == Idle or mode == Armed)"
    updates:
      gps: Lost

  - name: gps_restore
    guard: "gps == Lost"
    updates:
      gps: OK

  - name: battery_drain
    guard: "battery == High"
    updates:
      battery: Low

  - name: sensor_disagree
    guard: "sensor_agreement == true and (mode == Idle or mode == Armed)"
    updates:
      sensor_agreement: false

  - name: sensor_agree
    guard: "sensor_agreement == false"
    updates:
      sensor_agreement: true
